<p>Skyciv Renderer</p>

<div class="toolbar">
  <button (click)="onRender()">Render</button>
  <button (click)="onFitView()">Fit View</button>
  <button (click)="onResetCamera()">Reset Camera</button>
  <button (click)="onToggleWireframe()">Wireframe</button>
  <button (click)="onRebuild()">Rebuild Structure</button>
</div>

<div id="renderer-container"
     style="width:100%; height:600px; position:relative;">
</div>

<div class="toolbar">
  <button (click)="onSave()">Save Model</button>

  <label class="load-btn">
    Load Model
    <input type="file" accept=".json" (change)="onLoad($event)" hidden>
  </label>
</div>
